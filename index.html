<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europe Map Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --sea:#0d2231; --sea-line:#163449; --panel:#132e42; --panel-2:#1a3b53; --edge:#25506b;
  --land:#cfd9c3; --land-hi:#f3ebae; --land-off:#3d5866; --border:#0d2231;
  --ink:#eef4f1; --muted:#93b3bd; --dark-ink:#0d2231;
  --gold:#ffc93c; --good:#4fd68a; --bad:#ff6250;
  --m0:#2a4a5e; --m1:#d9893a; --m2:#d8c447; --m3:#4fd68a;
  --display:"Bungee", "Arial Black", Impact, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:12px 24px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.logo{font-family:var(--display);font-size:clamp(20px,3.2vw,30px);letter-spacing:.5px;line-height:1;color:var(--gold);margin:0}
.logo span{color:var(--ink)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:6px 12px;min-width:78px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat.fire b{color:var(--gold)}
nav.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{font:inherit;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:999px;padding:8px 14px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--gold);color:var(--dark-ink);border-color:var(--gold)}
.modes button:hover{border-color:var(--gold)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.board{position:relative;background:var(--sea);border:1px solid var(--edge);border-radius:14px;overflow:hidden;touch-action:none}
.board svg{display:block;width:100%;height:auto;aspect-ratio:1000/820;max-height:78vh;cursor:grab;user-select:none;-webkit-user-select:none}
.board.tilted svg{aspect-ratio:820/1000}
.board svg.dragging{cursor:grabbing}
.grid line{stroke:var(--sea-line);stroke-width:1;vector-effect:non-scaling-stroke}
.bg path{fill:var(--land-off);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke}
.cty path{fill:var(--land);stroke:var(--border);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
.cty path:hover{fill:var(--land-hi)}
.cty circle{fill:var(--land);stroke:var(--border);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
.cty circle:hover{fill:var(--land-hi)}
.cty .dim{fill:#6f8a8b}
.cty .target{fill:var(--gold)!important;animation:pulse 1.1s ease-in-out infinite}
.cty .good{fill:var(--good)!important}
.cty .bad{fill:var(--bad)!important}
.cty .reveal{fill:var(--gold)!important}
.cty .lv0{fill:#93a3a0}.cty .lv1{fill:var(--m1)}.cty .lv2{fill:var(--m2)}.cty .lv3{fill:var(--m3)}
@keyframes pulse{50%{fill:#fff3b8}}
.ring{fill:none;stroke:var(--gold);stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none;animation:ring 1.1s ease-out infinite}
@keyframes ring{0%{opacity:1}100%{opacity:.2}}
.labs text{font-family:var(--body);font-weight:700;fill:var(--dark-ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.labs text.out{fill:var(--ink);stroke:var(--sea)}
.labs text.big{fill:var(--dark-ink);stroke:var(--gold);stroke-width:4px}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button,.chip-btn{font:inherit;font-weight:700;width:38px;height:38px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;font-size:18px;line-height:1}
.mapctl button:hover{border-color:var(--gold)}
.mapbar{position:absolute;left:10px;bottom:10px;right:60px;display:flex;flex-wrap:wrap;gap:6px}
.mapbar button{font:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--edge);background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--ink);cursor:pointer}
.mapbar button[aria-pressed="true"]{background:var(--ink);color:var(--dark-ink)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--dark-ink);font-weight:700;padding:8px 16px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.toast.good{background:var(--good)}.toast.bad{background:var(--bad);color:#fff}
aside{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px}
.card h2{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.prompt-k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.prompt{font-family:var(--display);font-size:clamp(24px,3vw,32px);line-height:1.1;margin:4px 0 6px;text-wrap:balance;color:var(--gold)}
.sub{color:var(--muted);margin:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.choices button{font:inherit;font-weight:700;padding:12px 8px;border-radius:10px;border:1px solid var(--edge);background:var(--panel-2);color:var(--ink);cursor:pointer;min-height:52px}
.choices button:hover{border-color:var(--gold)}
.choices button.good{background:var(--good);color:var(--dark-ink);border-color:var(--good)}
.choices button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.choices kbd{font-family:var(--body);font-size:11px;opacity:.6;margin-right:6px}
form.type{display:flex;gap:8px;margin-top:12px}
form.type input{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:2px solid var(--edge);background:var(--sea);color:var(--ink)}
form.type input:focus{border-color:var(--gold);outline:none}
.go{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:0;background:var(--gold);color:var(--dark-ink);cursor:pointer}
.ghost{font:inherit;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--edge);background:transparent;color:var(--ink);cursor:pointer}
.ghost:hover{border-color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.progress{height:8px;border-radius:99px;background:var(--sea);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.feedback{min-height:24px;margin-top:10px;font-weight:700}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.timer{font-family:var(--display);font-size:44px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
label.sel{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;padding:8px 10px;border-radius:10px;border:1px solid var(--edge);background:var(--panel-2);color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.chips button{font:inherit;font-weight:700;font-size:12px;padding:6px 0;border-radius:6px;border:0;cursor:pointer;color:var(--dark-ink);background:var(--m0);color:var(--ink);font-variant-numeric:tabular-nums}
.chips button.lv1{background:var(--m1);color:var(--dark-ink)}.chips button.lv2{background:var(--m2);color:var(--dark-ink)}.chips button.lv3{background:var(--m3);color:var(--dark-ink)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.bank{columns:2;column-gap:12px;font-size:13px;margin:0;padding:0;list-style:none}
.bank li{display:flex;gap:6px;padding:1px 0;break-inside:avoid}
.bank li b{min-width:22px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bank button{all:unset;cursor:pointer}
.bank button:hover{color:var(--gold)}
.bank button:focus-visible{outline:2px solid var(--gold)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.summary ul{margin:6px 0 0;padding-left:18px;columns:2;font-size:14px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1 class="logo">Europe <span>Map Quest</span></h1>
    <div class="stats">
      <div class="stat"><b id="sScore">0</b><small>Points</small></div>
      <div class="stat fire"><b id="sStreak">0</b><small>Streak</small></div>
      <div class="stat"><b id="sBest">0</b><small>Best streak</small></div>
      <div class="stat"><b id="sMastered">0/47</b><small>Mastered</small></div>
    </div>
  </header>

  <nav class="modes" aria-label="Game mode">
    <button data-mode="explore" aria-pressed="true">Study</button>
    <button data-mode="find" aria-pressed="false">Find it</button>
    <button data-mode="pick" aria-pressed="false">Name it</button>
    <button data-mode="type" aria-pressed="false">Test mode</button>
    <button data-mode="speed" aria-pressed="false">60s Blitz</button>
  </nav>

  <main>
    <div class="board" id="board">
      <svg id="map" viewBox="0 0 1000 820" role="img" aria-label="Map of Europe">
        <rect id="seaRect" x="-2000" y="-2000" width="5000" height="5000" fill="var(--sea)"></rect>
        <g id="world">
          <g class="grid" id="grid"></g>
          <g class="bg" id="bg"></g>
          <g class="cty" id="cty"></g>
          <g id="fxl"></g>
          <g class="labs" id="labs"></g>
        </g>
      </svg>
      <div class="toast" id="toast"></div>
      <div class="mapctl">
        <button id="zIn" aria-label="Zoom in">+</button>
        <button id="zOut" aria-label="Zoom out">&minus;</button>
        <button id="zReset" aria-label="Show all of Europe" style="font-size:13px">ALL</button>
      </div>
      <div class="mapbar" id="mapbar">
        <button data-zoom="west">West</button>
        <button data-zoom="central">Central</button>
        <button data-zoom="balkans">Balkans</button>
        <button data-zoom="north">North</button>
        <button data-zoom="east">East</button>
        <button id="tilt" aria-pressed="false" title="Rotate the map so north points right, like the test sheet">Turn like my test</button>
      </div>
    </div>

    <aside>
      <section class="card" id="panel"></section>
      <section class="card">
        <h2>Practice set</h2>
        <label class="sel" for="region">Countries to drill
          <select id="region">
            <option value="all">All 47 on the test</option>
            <option value="west">West + islands (11)</option>
            <option value="central">Central + Italy (12)</option>
            <option value="balkans">Balkans (8)</option>
            <option value="north">North + Baltic (7)</option>
            <option value="east">East + Turkey (9)</option>
            <option value="tiny">Tiny countries (7)</option>
            <option value="weak">My weak spots</option>
          </select>
        </label>
      </section>
      <section class="card">
        <h2>Mastery by test number</h2>
        <div class="chips" id="chips"></div>
        <div class="legend"><span><i style="background:var(--m0)"></i>new</span><span><i style="background:var(--m1)"></i>1 right</span><span><i style="background:var(--m2)"></i>2 in a row</span><span><i style="background:var(--m3)"></i>mastered</span></div>
        <div class="row"><button class="ghost" id="resetStats">Reset progress</button><span id="resetConfirm" hidden><button class="ghost" id="resetYes" style="border-color:var(--bad)">Yes, wipe it</button></span><button class="ghost" id="sound" aria-pressed="true">Sound on</button></div>
      </section>
    </aside>
  </main>
</div>
<canvas id="fx"></canvas>

    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === "good" ? [660, 880] : kind === "win" ? [523, 659, 784, 1046] : [220, 165];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === "bad" ? "sawtooth" : "triangle"; o.frequency.value = f;
      const t = actx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    });
  }catch(e){}
}
const fx = $("fx"), fctx = fx.getContext("2d"); let bits = [], fxOn = false;
function confetti(n = 120){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  fx.width = innerWidth; fx.height = innerHeight;
  const cols = ["#ffc93c","#4fd68a","#ff6250","#eef4f1","#7cc4ff"];
  for (let i = 0; i < n; i++) bits.push({x:innerWidth/2 + (Math.random()-.5)*200, y:innerHeight*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, r:Math.random()*6+3, c:cols[i%5], a:Math.random()*6, life:0});
  if (!fxOn){ fxOn = true; requestAnimationFrame(tick); }
}
function tick(){
  fctx.clearRect(0,0,fx.width,fx.height);
  bits.forEach(b => { b.vy += .35; b.x += b.vx; b.y += b.vy; b.a += .2; b.life++; fctx.save(); fctx.translate(b.x,b.y); fctx.rotate(b.a); fctx.fillStyle = b.c; fctx.fillRect(-b.r/2,-b.r/4,b.r,b.r/2); fctx.restore(); });
  bits = bits.filter(b => b.y < fx.height + 20 && b.life < 240);
  if (bits.length) requestAnimationFrame(tick); else { fxOn = false; fctx.clearRect(0,0,fx.width,fx.height); }
}

/* ---------- stats ---------- */
function st(n){ return stats[n] || (stats[n] = {r:0, w:0, lv:0}); }
function record(n, ok, pts){
  const s = st(n);
  if (ok){ s.r++; s.lv = Math.min(3, s.lv + 1); streak++; score += pts * (1 + Math.floor(streak / 5)); beep("good");
    if (streak > best){ best = streak; store.set("best", best); }
    if (streak % 5 === 0){ confetti(70); toast(streak + " in a row! Points now x" + (1 + Math.floor(streak/5)), "good"); }
  } else { s.w++; s.lv = Math.max(0, s.lv - 1); streak = 0; beep("bad"); }
  store.set("stats", stats); renderStats();
}
function renderStats(){
  $("sScore").textContent = score; $("sStreak").textContent = streak; $("sBest").textContent = best;
  const m = C.filter(c => (stats[c.num]||{}).lv >= 3).length;
  $("sMastered").textContent = m + "/47";
  const ch = $("chips");
  if (!ch.children.length){
    C.forEach(c => { const b = document.createElement("button"); b.textContent = c.num; b.title = c.n; b.onclick = () => { if (mode === "explore") showInfo(c.num, true); else toast("#" + c.num + " is " + c.n); }; ch.appendChild(b); });
  }
  [...ch.children].forEach((b, i) => { const lv = (stats[C[i].num]||{}).lv || 0; b.className = lv ? "lv" + lv : ""; b.setAttribute("aria-label", "#" + C[i].num + " " + C[i].n + ", mastery " + lv + " of 3"); });
}
$("resetStats").onclick = () => { $("resetConfirm").hidden = false; };
$("resetYes").onclick = () => { stats = {}; best = 0; score = 0; streak = 0; store.set("stats", stats); store.set("best", 0); $("resetConfirm").hidden = true; renderStats(); setMode(mode); toast("Progress reset"); };
function setSound(){ $("sound").textContent = soundOn ? "Sound on" : "Sound off"; $("sound").setAttribute("aria-pressed", soundOn); }
$("sound").onclick = () => { soundOn = !soundOn; store.set("sound", soundOn); setSound(); };

/* ---------- deck (spaced repetition) ---------- */
function pool(){
  const r = $("region").value;
  if (r === "weak"){
    const w = C.filter(c => (stats[c.num]||{lv:0}).lv < 3).sort((a,b) => (st(a.num).lv - st(b.num).lv) || (st(b.num).w - st(a.num).w)).map(c => c.num);
    return w.length ? w.slice(0, 12) : C.map(c => c.num);
  }
  return r === "all" ? C.map(c => c.num) : GROUPS[r];
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
let deck = [], done = 0, total = 0, missed = new Set(), firstTry = 0;
function newDeck(){
  const p = pool();
  // weak ones first-ish
  deck = shuffle([...p]).sort((a,b) => (st(a).lv - st(b).lv) * (Math.random() < .5 ? 1 : 0));
  total = deck.length; done = 0; missed = new Set(); firstTry = 0;
}
function requeue(n){ const pos = Math.min(deck.length, 2 + (Math.random() * 3 | 0)); deck.splice(pos, 0, n); total++; }

/* ---------- modes ---------- */
let mode = "explore", cur = null, tries = 0, locked = false, blitz = null;
const panel = $("panel");
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
$("region").onchange = () => { store.set("region", $("region").value); setMode(mode); if ($("region").value in GROUPS) fitNums(GROUPS[$("region").value], .08); };

function setMode(m){
  mode = m; if (blitz){ clearInterval(blitz.t); blitz = null; }
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  clearMarks(); locked = false;
  if (m === "explore") return renderExplore();
  if (m === "speed") return renderBlitzIntro();
  newDeck(); next();
}
function dimOutside(){
  const p = new Set(pool());
  if (p.size < 47) C.forEach(c => { if (!p.has(c.num)) mark(c.num, "dim"); });
}

/* Study */
let exploreLabels = "num", heat = false;
function renderExplore(sel){
  clearMarks(); setLabels(exploreLabels);
  if (heat) C.forEach(c => mark(c.num, "lv" + ((stats[c.num]||{}).lv || 0)));
  panel.innerHTML = `
    <div class="prompt-k">Study mode</div>
    <div class="prompt" id="exTitle">Tap any country</div>
    <p class="sub" id="exSub">The numbers match your test sheet. Scroll or pinch to zoom, drag to move around.</p>
    <div class="row">
      <label class="sel" for="lblSel">Map labels
        <select id="lblSel"><option value="num">Test numbers</option><option value="name">Country names</option><option value="both">Both</option><option value="none">None</option></select>
      </label>
      <button class="ghost" id="heatBtn" aria-pressed="${heat}" style="align-self:flex-end">${heat ? "Hide" : "Show"} mastery colors</button>
    </div>
    <h2 style="margin-top:16px">Word bank (click to locate)</h2>
    <ul class="bank" id="bank"></ul>
    <p class="note">#22 looks like Vatican City on your sheet. It isn't in the word bank, so ask your teacher whether it counts. San Marino is #23.</p>`;
  $("lblSel").value = exploreLabels;
  $("lblSel").onchange = e => { exploreLabels = e.target.value; setLabels(exploreLabels); };
  $("heatBtn").onclick = () => { heat = !heat; renderExplore(); };
  const bank = $("bank");
  [...C].sort((a,b) => a.n.localeCompare(b.n)).forEach(c => {
    const li = document.createElement("li"); li.innerHTML = `<b>${c.num}</b><button>${c.n}</button>`;
    li.querySelector("button").onclick = () => showInfo(c.num, true); bank.appendChild(li);
  });
  if (sel) showInfo(sel);
}
function showInfo(n, zoom){
  clsAll("target"); $("fxl").innerHTML = "";
  mark(n, "target"); ring(n);
  const c = byNum[n], s = stats[n];
  $("exTitle").textContent = "#" + n + "  " + c.n;
  $("exSub").textContent = s ? `You've got it right ${s.r} time${s.r===1?"":"s"} and wrong ${s.w} time${s.w===1?"":"s"}.` : "You haven't been quizzed on this one yet.";
  if (zoom && (TINY.includes(n) || c.a < 1500)) fitNums([n], 1.2);
}

/* Quiz modes */
function next(){
  clearMarks(); dimOutside(); locked = false; tries = 0;
  if (!deck.length) return finish();
  cur = deck.shift();
  const c = byNum[cur];
  const prog = `<div class="progress"><i style="width:${(done/total*100).toFixed(1)}%"></i></div><div class="sub" style="margin-top:6px;font-size:13px">${done} of ${total} done · ${firstTry} first try</div>`;
  if (mode === "find"){
    setLabels(exploreLabels === "none" ? "none" : "num");
    panel.innerHTML = `<div class="prompt-k">Find it on the map</div><div class="prompt">${c.n}</div><p class="sub">Click the country. You get 3 tries.</p><div class="feedback" id="fb"></div>
      <div class="row"><button class="ghost" id="skip">Show me</button><button class="ghost" id="numsT">${exploreLabels === "none" ? "Show" : "Hide"} numbers</button></div>${prog}`;
    $("skip").onclick = () => reveal(true);
    $("numsT").onclick = () => { exploreLabels = exploreLabels === "none" ? "num" : "none"; setLabels(exploreLabels === "none" ? "none" : "num"); $("numsT").textContent = (exploreLabels === "none" ? "Show" : "Hide") + " numbers"; };
  }
  else if (mode === "pick"){
    setLabels("none", cur); mark(cur, "target"); ring(cur);
    const opts = shuffle([cur, ...distractors(cur, 3)]);
    panel.innerHTML = `<div class="prompt-k">Name it</div><div class="prompt">What is #${cur}?</div><p class="sub">It's flashing on the map. Keys 1 to 4 work too.</p>
      <div class="choices" id="choices">${opts.map((o,i) => `<button data-n="${o}"><kbd>${i+1}</kbd>${byNum[o].n}</button>`).join("")}</div><div class="feedback" id="fb"></div>${prog}`;
    document.querySelectorAll("#choices button").forEach(b => b.onclick = () => pickAnswer(+b.dataset.n, b));
    autoFrame(cur);
  }
  else if (mode === "type"){
    setLabels("none", cur); mark(cur, "target"); ring(cur);
    panel.innerHTML = `<div class="prompt-k">Test mode</div><div class="prompt">Write #${cur}</div><p class="sub">Type the country name like you would on the test. Spelling counts.</p>
      <form class="type" id="tf" autocomplete="off"><input id="ans" placeholder="Country name" aria-label="Country name" spellcheck="false" autocapitalize="words"><button class="go">Check</button></form>
      <div class="feedback" id="fb"></div><div class="row"><button class="ghost" id="hint">Hint</button><button class="ghost" id="skip">I don't know</button></div>${prog}`;
    $("tf").onsubmit = e => { e.preventDefault(); typeAnswer($("ans").value); };
    $("hint").onclick = () => { const n = byNum[cur].n; tries = Math.max(tries, 1); $("fb").className = "feedback"; $("fb").textContent = `Starts with "${n.slice(0, 2)}" and has ${n.replace(/ /g,"").length} letters.`; $("ans").focus(); };
    $("skip").onclick = () => { if (locked) return; locked = true; record(cur, false, 0); missed.add(cur); requeue(cur); fb(`It's ${byNum[cur].n}.`, "bad"); setTimeout(next, 1800); };
    setTimeout(() => $("ans") && $("ans").focus({preventScroll:true}), 50);
    autoFrame(cur);
  }
}
function autoFrame(n){
  // keep the target visible; zoom in for tiny ones
  if (TINY.includes(n) || byNum[n].a < 1500) fitNums([n], 1.6);
  else if (view.w < baseW()) resetView();
}
function distractors(n, k){
  const c = byNum[n];
  const near = C.filter(o => o.num !== n).map(o => ({o, d: Math.hypot(o.x - c.x, o.y - c.y) + Math.random()*120})).sort((a,b) => a.d - b.d);
  return near.slice(0, k).map(x => x.o.num);
}
function fb(msg, kind){ const f = $("fb"); if (f){ f.textContent = msg; f.className = "feedback " + (kind||""); } }
function correct(pts, msg){
  locked = true; done++; if (tries === 0) firstTry++;
  record(cur, true, pts); clsAll("target"); mark(cur, "good");
  fb(msg || "Correct! +" + pts, "good"); toast(byNum[cur].n + " ✓", "good");
  setTimeout(next, 900);
}
function reveal(skipped){
  locked = true; done++; missed.add(cur); requeue(cur);
  if (!skipped || tries === 0) record(cur, false, 0); else { streak = 0; renderStats(); }
  mark(cur, "reveal"); ring(cur);
  fb(`Here's ${byNum[cur].n} (#${cur}). It'll come back soon.`, "bad");
  autoFrame(cur);
  setTimeout(() => { if (mode === "find" || mode === "speed") resetViewIfZoomed(); next(); }, 2200);
}
function resetViewIfZoomed(){ if ($("region").value === "all" && view.w < baseW()*.6) resetView(); }

function onCountryClick(n){
  if (mode === "explore") return showInfo(n);
  if (mode === "speed") return blitzClick(n);
  if (mode !== "find" || locked || !cur) { if (mode !== "find") toast("#" + n + " " + byNum[n].n); return; }
  if (n === cur) return correct([100, 50, 25][tries]);
  tries++;
  shapes[n].forEach(s => { s.classList.add("bad"); setTimeout(() => s.classList.remove("bad"), 700); });
  panel.classList.remove("shake"); void panel.offsetWidth; panel.classList.add("shake");
  beep("bad");
  if (tries >= 3) return reveal(false);
  fb(`That's ${byNum[n].n}. ${3 - tries} ${3 - tries === 1 ? "try" : "tries"} left.` + (tries === 2 ? " " + hintDir(n) : ""), "bad");
}
function hintDir(from){
  const a = byNum[from], b = byNum[cur]; const dx = b.x - a.x, dy = b.y - a.y;
  const ns = dy < -25 ? "north" : dy > 25 ? "south" : ""; const ew = dx > 25 ? "east" : dx < -25 ? "west" : "";
  return ns || ew ? `Go ${ns}${ns && ew ? "-" : ""}${ew}.` : "It's very close!";
}
function pickAnswer(n, btn){
  if (locked) return;
  if (n === cur){ btn.classList.add("good"); return correct(tries ? 40 : 100); }
  tries++; btn.classList.add("bad"); btn.disabled = true; beep("bad");
  if (tries === 1){ record(cur, false, 0); missed.add(cur); requeue(cur); done--; }
  fb(`#${n} is ${byNum[n].n}, not this one.`, "bad"); mark(n, "bad"); setTimeout(() => shapes[n].forEach(s => s.classList.remove("bad")), 900);
}
document.addEventListener("keydown", e => {
  if (mode !== "pick" || locked || e.target.tagName === "INPUT") return;
  const b = document.querySelectorAll("#choices button")[+e.key - 1]; if (b && !b.disabled) b.click();
});
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z& ]/g,"").replace(/\s+/g," ").trim(); }
function lev(a, b){ const m = Array.from({length:a.length+1}, (_, i) => [i]); for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return m[a.length][b.length]; }
function typeAnswer(v){
  if (locked) return;
  const a = norm(v); if (!a) return;
  const name = byNum[cur].n, targets = [norm(name), ...(ALIASES[name] || [])];
  if (targets.includes(a)) return correct(tries ? 50 : 150, `Correct! +${tries ? 50 : 150}`);
  const dist = Math.min(...targets.map(t => lev(a, t)));
  if (dist <= (a.length > 6 ? 2 : 1)) { correct(75, `Right country, but it's spelled "${name}". +75`); return; }
  tries++;
  // did they name a different real country?
  const other = C.find(c => c.num !== cur && [norm(c.n), ...(ALIASES[c.n]||[])].includes(a));
  const inp = $("ans"); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); beep("bad");
  if (other){ mark(other.num, "bad"); setTimeout(() => shapes[other.num].forEach(s => s.classList.remove("bad")), 1200); }
  if (tries >= 2){ locked = true; done++; record(cur, false, 0); missed.add(cur); requeue(cur); fb(`It's ${name}.` + (other ? ` ${other.n} is #${other.num}.` : ""), "bad"); setTimeout(next, 2200); return; }
  fb(other ? `No, ${other.n} is #${other.num} (shown in red). One more try.` : `Not quite. One more try.`, "bad");
  inp.select();
}
function finish(){
  clearMarks(); setLabels("num");
  const pct = total ? Math.round(firstTry / (total - (total - done)) * 100) : 0;
  const acc = Math.round(firstTry / Math.max(1, pool().length) * 100);
  if (acc >= 80){ confetti(220); beep("win"); }
  panel.innerHTML = `<div class="prompt-k">Round complete</div><div class="prompt">${acc}% first try</div>
    <p class="sub">${firstTry} of ${pool().length} right on the first go.${acc >= 90 ? " You're ready for this test." : acc >= 70 ? " Getting there. Run it again." : " Keep going, each round gets easier."}</p>
    ${missed.size ? `<div class="summary"><h2 style="margin-top:12px">Practice these</h2><ul>${[...missed].map(n => `<li>#${n} ${byNum[n].n}</li>`).join("")}</ul></div>` : ""}
    <div class="row"><button class="go" id="again">Play again</button><button class="ghost" id="weak">Drill weak spots</button></div>`;
  missed.forEach(n => mark(n, "bad"));
  $("again").onclick = () => setMode(mode);
  $("weak").onclick = () => { $("region").value = "weak"; setMode(mode); };
}

/* Blitz */
function renderBlitzIntro(){
  setLabels("none"); dimOutside();
  panel.innerHTML = `<div class="prompt-k">60 second blitz</div><div class="prompt">How many can you find?</div>
    <p class="sub">Names pop up one after another. Click each one on the map. Wrong clicks cost 3 seconds.</p>
    <div class="row"><button class="go" id="startB">Start</button><span class="sub">Best: <b id="bb">${blitzBest}</b></span></div>`;
  $("startB").onclick = startBlitz;
}
function startBlitz(){
  resetView(); setLabels("none");
  blitz = {left:60, n:0, q: shuffle([...pool()]), t:null};
  panel.innerHTML = `<div class="row" style="margin-top:0;justify-content:space-between"><div class="timer" id="tm">60</div><div style="text-align:right"><div class="prompt-k">Found</div><div class="timer" id="bn" style="color:var(--good)">0</div></div></div>
    <div class="prompt-k" style="margin-top:12px">Click</div><div class="prompt" id="bq"></div><div class="feedback" id="fb"></div>`;
  blitzNext();
  blitz.t = setInterval(() => { blitz.left--; updTimer(); if (blitz.left <= 0) endBlitz(); }, 1000);
}
function updTimer(){ const t = $("tm"); if (t){ t.textContent = Math.max(0, blitz.left); t.classList.toggle("low", blitz.left <= 10); } }
function blitzNext(){ if (!blitz.q.length) blitz.q = shuffle([...pool()]); cur = blitz.q.shift(); $("bq").textContent = byNum[cur].n; }
function blitzClick(n){
  if (!blitz) return;
  if (n === cur){ blitz.n++; $("bn").textContent = blitz.n; mark(n, "good"); setTimeout(() => shapes[n].forEach(s => s.classList.remove("good")), 500); record(cur, true, 50); fb(""); blitzNext(); }
  else { blitz.left -= 3; updTimer(); mark(n, "bad"); setTimeout(() => shapes[n].forEach(s => s.classList.remove("bad")), 500); beep("bad"); fb(`That's ${byNum[n].n}. −3s`, "bad"); streak = 0; renderStats(); if (blitz.left <= 0) endBlitz(); }
}
function endBlitz(){
  clearInterval(blitz.t); const n = blitz.n; blitz = null; cur = null;
  const rec = n > blitzBest; if (rec){ blitzBest = n; store.set("blitz", n); confetti(220); beep("win"); }
  panel.innerHTML = `<div class="prompt-k">Time's up</div><div class="prompt">${n} found</div><p class="sub">${rec ? "New personal best!" : "Your best is " + blitzBest + "."}</p><div class="row"><button class="go" id="startB">Go again</button></div>`;
  $("startB").onclick = startBlitz;
}

/* ---------- boot ---------- */
const savedRegion = store.get("region", "all"); if ([...$("region").options].some(o => o.value === savedRegion)) $("region").value = savedRegion;
setSound(); renderStats(); resetView(false); setMode("explore");
window.addEventListener("resize", () => applyView());
</script>

</html>
